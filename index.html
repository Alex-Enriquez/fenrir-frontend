<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23F8C22E'/%3E%3Cstop offset='100%25' stop-color='%23001D5C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='800' fill='%230B0F1A' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alamex.TI</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0B0F1A;
        height: 100%;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top left, #131A2E 0%, #0B0F1A 60%);
        z-index: 9999;
      }
      #splash .logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #F8C22E, #001D5C);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        font-weight: 800;
        font-size: 30px;
        color: #0B0F1A;
        animation: pulse 1.4s ease-in-out infinite;
      }
      #splash .texto {
        margin-top: 1rem;
        color: #8892AB;
        font-family: system-ui, sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.05em;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <div class="logo">A</div>
        <div class="texto">Cargando Alamex.TI…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
